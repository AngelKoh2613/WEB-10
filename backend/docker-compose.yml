services:
  postgres:
    image: postgres:16-alpine
    container_name: secureplan-postgres
    environment:
      POSTGRES_USER: secureplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: secureplan_dev
    ports:
      - "5434:5432"
    volumes:
      - secureplan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureplan -d secureplan_dev"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  secureplan_pg:
