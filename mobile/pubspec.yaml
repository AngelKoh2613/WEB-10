name: secureplan_mobile
description: "Agenda SecurePlan: sesión, calendario, datos locales cifrados, sincronización y exportación."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  sqlite3: ^3.7.1
  timezone: ^0.11.2

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
